<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="NetSec Academy: offline interactive networking and cybersecurity training with a network simulator, terminal labs, missions and assessments.">
  <title>NetSec Academy</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>
  <noscript>NetSec Academy needs JavaScript enabled.</noscript>

  <!-- Framework (vendored, runs offline, no build step) -->
  <script src="vendor/vue.global.prod.js"></script>

  <!-- Core -->
  <script src="js/core/util.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/core/ui.js"></script>

  <!-- Engines (framework-independent, unit tested in Node) -->
  <script src="js/engines/subnet.js"></script>
  <script src="js/engines/netsim.js"></script>
  <script src="js/engines/ios.js"></script>
  <script src="js/engines/terminal-fs.js"></script>
  <script src="js/engines/terminal-net.js"></script>
  <script src="js/engines/terminal-win.js"></script>
  <script src="js/engines/terminal.js"></script>
  <script src="js/engines/quiz.js"></script>
  <script src="js/engines/srs.js"></script>

  <!-- Content -->
  <script src="js/data/glossary.js"></script>
  <script src="js/data/flashcards.js"></script>
  <script src="js/data/lessons-l1-networking-a.js"></script>
  <script src="js/data/lessons-l1-networking-b.js"></script>
  <script src="js/data/lessons-l1-security.js"></script>
  <script src="js/data/lessons-l2.js"></script>
  <script src="js/data/lessons-l2-security.js"></script>
  <script src="js/data/lessons-l3.js"></script>
  <script src="js/data/lessons-l3-security.js"></script>
  <script src="js/data/labs-netsim.js"></script>
  <script src="js/data/labs-terminal.js"></script>
  <script src="js/data/labs-security.js"></script>
  <script src="js/data/labs-troubleshoot.js"></script>
  <script src="js/data/missions.js"></script>
  <script src="js/data/achievements.js"></script>
  <script src="js/data/resources.js"></script>

  <!-- Progress & gamification (depends on content) -->
  <script src="js/core/gamification.js"></script>
  <script src="js/core/progress.js"></script>

  <!-- Vue components -->
  <script src="js/views/components.js"></script>
  <script src="js/views/demos.js"></script>
  <script src="js/views/quiz-view.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/paths.js"></script>
  <script src="js/views/lesson.js"></script>
  <script src="js/views/netsim-view.js"></script>
  <script src="js/views/terminal-view.js"></script>
  <script src="js/views/labs.js"></script>
  <script src="js/views/missions-view.js"></script>
  <script src="js/views/challenges.js"></script>
  <script src="js/views/assessments.js"></script>
  <script src="js/views/achievements-view.js"></script>
  <script src="js/views/resources-view.js"></script>
  <script src="js/views/profile.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Register the service worker for installable, offline PWA use (only works over http/https, not file://).
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
